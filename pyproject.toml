[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "permgate"
version = "0.1.0"
description = "Prompt instructions are requests; permissions are guarantees - proven by test suite"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
obs = ["braintrust"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
